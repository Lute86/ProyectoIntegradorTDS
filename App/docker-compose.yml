name: ifts29-prod

services:

  # ── Frontend (Nginx — HTTPS) ──────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: ifts29-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    networks:
      - prod-net

  # ── Backend (Node.js — Express) ───────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: ifts29-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-ifts29}
      DB_USER: ${DB_USER:-ifts29user}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      FRONTEND_URL: ${FRONTEND_URL:-https://localhost}
      UPLOAD_DIR: /app/uploads
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-20971520}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - prod-net

  # ── PostgreSQL 16 ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ifts29-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-ifts29}
      POSTGRES_USER: ${DB_USER:-ifts29user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d ${DB_NAME:-ifts29} -U ${DB_USER:-ifts29user}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - prod-net

volumes:
  postgres_data:
    name: ifts29-prod-postgres
  backend_uploads:
    name: ifts29-prod-uploads

networks:
  prod-net:
    driver: bridge
