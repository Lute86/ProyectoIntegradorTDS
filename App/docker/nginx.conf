# ─────────────────────────────────────────────────────────────────────────────
# Nginx — IFTS 29 Nueva Web (Producción)
#
# Puerto 80:  redirect a HTTPS + desafío Let's Encrypt
# Puerto 443: sirve React build + proxea /api → backend:3000
#
# Certificados:
#   - Auto-firmados: make ssl-selfsigned (genera docker/ssl/cert.pem + key.pem)
#   - Let's Encrypt:  montar certs en /etc/nginx/ssl/
# ─────────────────────────────────────────────────────────────────────────────

# ── HTTP: redirect + ACME challenge ──────────────────────────────────────────
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    # TLS moderno
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # React build
    root  /usr/share/nginx/html;
    index index.html;

    gzip       on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;

    # Assets — cache 1 año (Vite genera hashes)
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Uploads (imágenes subidas) → backend
    location ^~ /uploads/ {
        proxy_pass         http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        expires 1y;
        add_header Cache-Control "public";
    }

    # API → backend
    location /api/ {
        proxy_pass         http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_read_timeout    120s;
        proxy_connect_timeout  10s;
        proxy_send_timeout    120s;

        client_max_body_size 20M;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
