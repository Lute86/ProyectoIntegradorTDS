# ─────────────────────────────────────────────────────────────────────────────
# Nginx — IFTS 29 Nueva Web
#
# Puerto 80:  redirige todo a HTTPS (excepto el challenge de Let's Encrypt)
# Puerto 443: sirve el build de React y proxea /api → backend:3000
#
# Para desarrollo local (docker-compose.dev.yml) sólo se usa el bloque HTTP
# porque el frontend corre con Vite directamente, no pasa por Nginx.
# ─────────────────────────────────────────────────────────────────────────────

# ── HTTP: sólo para redirect y desafío ACME (Let's Encrypt) ─────────────────
server {
    listen 80;
    server_name _;

    # Let's Encrypt coloca aquí los archivos del desafío HTTP-01
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Todo lo demás: redirect permanente a HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name _;

    # Certificados generados por Certbot (montados como volumen en compose)
    # Si no tenés dominio todavía, comentá este bloque y usá sólo el HTTP
    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;

    # Parámetros SSL modernos
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       10m;

    # Carpeta raíz del build de React
    root  /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip       on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;

    # Assets estáticos — cache de 1 año (Vite genera hashes en los nombres)
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Proxy de la API al backend (red interna Docker, sin salir al exterior)
    location /api/ {
        proxy_pass         http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_read_timeout    120s;
        proxy_connect_timeout  10s;
        proxy_send_timeout    120s;

        client_max_body_size 20M;
    }

    # SPA fallback — rutas de React Router van a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
