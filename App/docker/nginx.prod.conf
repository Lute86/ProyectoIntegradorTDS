# ─────────────────────────────────────────────────────────────────────────────
# Nginx — Producción (solo HTTPS, puerto 443)
#
# Requiere certificados en /etc/nginx/ssl/cert.pem y key.pem
# Generados con: make ssl-selfsigned
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 443 ssl;
    server_name _;

    # Certificados SSL auto-firmados (montados como volumen desde docker/ssl/)
    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    # Parámetros SSL modernos
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       10m;

    # Carpeta raíz del build de React
    root  /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip       on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;

    # Assets estáticos — cache de 1 año (Vite genera hashes en los nombres)
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Proxy de la API al backend (red interna Docker, sin salir al exterior)
    location /api/ {
        proxy_pass         http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_read_timeout    120s;
        proxy_connect_timeout  10s;
        proxy_send_timeout    120s;

        client_max_body_size 20M;
    }

    # SPA fallback — rutas de React Router van a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
